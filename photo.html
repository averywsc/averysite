      <script>
        const buildImageGrid = (targetId, paths) => {
          const grid = document.getElementById(targetId);
          paths.forEach(path => {
            const fig = document.createElement('figure');
            const link = document.createElement('a');
            const img = document.createElement('img');
            link.href = path;
            link.target = '_blank';
            link.rel = 'noopener';
            img.src = path;
            img.alt = path;
            link.appendChild(img);
            fig.appendChild(link);
            grid.appendChild(fig);
          });
        };

        const smoothStageScroll = (stage, to, duration = 320) => {
          const start = stage.scrollTop;
          const distance = to - start;
          if (!distance) return;

          let startTime = null;
          const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

          const step = timestamp => {
            if (startTime === null) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
            stage.scrollTop = start + distance * easeOutCubic(progress);
            if (progress < 1) requestAnimationFrame(step);
          };

          requestAnimationFrame(step);
        };

        document.querySelectorAll('a[href^="#"]').forEach(link => {
          link.addEventListener('click', event => {
            const hash = link.getAttribute('href');
            if (!hash || hash === '#') return;
            const target = document.getElementById(hash.substring(1));
            const stage = document.getElementById('stage');
            if (target && stage) {
              event.preventDefault();
              smoothStageScroll(stage, target.offsetTop - 16, 320);
            }
          });
        });

        const addPlaceholder = (targetId, label) => {
          const grid = document.getElementById(targetId);
          const placeholder = document.createElement('div');
          placeholder.className = 'placeholder-card';
          placeholder.innerHTML = '<span>' + label + '</span><strong>Coming soon</strong>';
          grid.appendChild(placeholder);
        };
