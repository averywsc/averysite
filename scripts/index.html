    <link rel="stylesheet" href="../assets/pages.css?v=50" />
  </head>
  <body>
    <div class="site-shell">
      <aside class="site-rail">
        <div class="rail-top">
          <div class="rail-top-row">
            <a class="rail-brand" href="../">averybeuth.xyz</a>
            <a class="rail-handle" href="https://instagram.com/avery.beuth" target="_blank" rel="noopener">@avery.beuth</a>
          </div>
          <nav class="rail-nav" aria-label="Portfolio">
            <a href="../?zoom=1">photos</a>

            <a href="../music.html">music</a>
            <a href="../film.html">films</a>
          </nav>
        </div>
        <div class="rail-meta">
          <a href="https://instagram.com/avery.beuth" target="_blank" rel="noopener">@avery.beuth</a>
          <a href="../privacy.html">privacy</a>
        </div>
      </aside>

      <main class="site-main">
        <div class="page-wrap">
          <header class="page-header">
            <h1 class="page-title">Scripts</h1>
            <p class="page-subtitle">screenplay pieces. click any title to read or download the pdf.</p>
          </header>

          <div id="scriptCards" class="script-grid"></div>
        </div>
      </main>
    </div>

    <script>
      const escapeHtml = (value) => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      const parseScriptFile = (text) => {
        const lines = text.split(/\r?\n/);
        let title = '';
        let subtitle = '';
        let description = '';

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!title && /^#\s+/.test(line)) {
            title = line.replace(/^#\s+/, '').trim();
            continue;
          }
          if (!subtitle && /^###\s+/.test(line) && !/^(?:###\s+)?(?:FADE IN:|INT\.|EXT\.|SUPER:|CUT TO:|CUT TO BLACK|INSERT:|END\.)/i.test(line)) {
            subtitle = line.replace(/^###\s+/, '').trim();
            continue;
          }
          if (!description && /^\*.*\*$/.test(line)) {
            description = line.replace(/^\*|\*$/g, '').trim();
            continue;
          }
          if (line === 'FADE IN:' || /^###\s+/.test(line) || /^CUT\s+TO:/.test(line) || /^CUT\s+TO\s+BLACK/i.test(line) || /^INSERT:/.test(line) || /^SUPER:/.test(line)) {
            break;
          }
        }
        return { title, subtitle, description };
      };

      const SCRIPT_THEMES = {
        'the-long-way-round': { glow: '232, 198, 128', color: '#f2dfc0', font: "'Cormorant Garamond', Georgia, serif", style: 'italic', size: '25px' },
        'the-last-roll': { glow: '214, 168, 118', color: '#ead5b8', font: "'Cormorant Garamond', Georgia, serif", style: 'normal', size: '25px' },
        'static': { glow: '168, 174, 182', color: '#d5dae0', font: "'DM Sans', sans-serif", style: 'normal', size: '21px' },
        'frequencies': { glow: '104, 188, 212', color: '#cde8f2', font: "'Courier Prime', monospace", style: 'normal', size: '21px' },
        'artificial-light': { glow: '128, 162, 224', color: '#d6e2f8', font: "'DM Sans', sans-serif", style: 'normal', size: '21px' },
        'heavy-weather': { glow: '126, 146, 186', color: '#ced8ec', font: "'Lora', Georgia, serif", style: 'italic', size: '22px' },
        'the-noise-floor': { glow: '204, 148, 96', color: '#e8ceb2', font: "'Courier Prime', monospace", style: 'normal', size: '21px' },
        'the-collar': { glow: '148, 166, 180', color: '#d6e0e8', font: "'Cormorant Garamond', Georgia, serif", style: 'normal', size: '25px' },
        'halcyon': { glow: '204, 162, 108', color: '#e6d2b4', font: "'Courier Prime', monospace", style: 'normal', size: '21px' },
        'residual': { glow: '218, 146, 78', color: '#f0cfa8', font: "'Cormorant Garamond', Georgia, serif", style: 'normal', size: '26px' },
        'incept-date': { glow: '196, 118, 212', color: '#ecc8f4', font: "'Special Elite', monospace", style: 'normal', size: '22px' },
        'permafrost': { glow: '144, 198, 226', color: '#d8eef8', font: "'Courier Prime', monospace", style: 'normal', size: '21px' },
        'the-array': { glow: '224, 134, 82', color: '#f2cbb0', font: "'Courier Prime', monospace", style: 'normal', size: '21px' },
        'leos-date': { glow: '143, 160, 168', color: '#8fa0a8', font: "'Bodoni Moda', Georgia, serif", style: 'normal', size: '23px' },
      };

      const buildScriptCard = (file, script) => {
        const article = document.createElement('article');
        article.className = 'script-card';
        const slug = file.replace(/\.md$/, '');
        const theme = SCRIPT_THEMES[slug] || { glow: '200, 195, 185', color: 'rgba(236, 230, 220, 0.94)' };
        article.dataset.glow = theme.glow;
        article.style.borderLeft = `2px solid rgba(${theme.glow}, 0.28)`;
        const viewHref = 'view.html?slug=' + encodeURIComponent(slug);
        const pdfHref = 'pdfs/' + slug + '.pdf';
        const titleStyle = theme.font
          ? `style="font-family:${theme.font};font-style:${theme.style || 'normal'};font-size:${theme.size || '22px'};color:${theme.color};"`
          : `style="color:${theme.color};"`;
        article.innerHTML = `
          <div>
            <h3><a href="${viewHref}" ${titleStyle}>${escapeHtml(script.title || slug)}</a></h3>
            ${script.subtitle ? `<div class="script-card-sub">${escapeHtml(script.subtitle)}</div>` : ''}
            ${script.description ? `<p class="script-card-desc">${escapeHtml(script.description)}</p>` : ''}
          </div>
          <div class="script-card-actions">
            <a class="text-link" href="${viewHref}">read script</a>
            <a class="text-link" href="${pdfHref}" download>download pdf</a>
          </div>
        `;
        return article;
      };

      fetch('manifest.json')
        .then((res) => res.json())
        .then((files) => Promise.all(files.map(async (file) => {
          const text = await fetch(file).then((r) => r.text());
          return { file, ...parseScriptFile(text) };
        })))
        .then((scripts) => {
          const grid = document.getElementById('scriptCards');
          scripts.forEach((script) => grid.appendChild(buildScriptCard(script.file, script)));
        })
        .catch((err) => {
          document.getElementById('scriptCards').innerHTML = '<div class="empty-state">Unable to load script files.</div>';
          console.error(err);
        });
    </script>
    <script type="module" src="../assets/pages.js?v=50"></script>
</body>
</html>
