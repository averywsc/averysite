  <body>
    <div class="site-shell">
      <aside class="site-rail">
        <div class="rail-top">
          <div class="rail-top-row">
            <a class="rail-brand" href="../">averybeuth.xyz</a>
            <a class="rail-handle" href="https://instagram.com/avery.beuth" target="_blank" rel="noopener">@avery.beuth</a>
          </div>
          <nav class="rail-nav" aria-label="Portfolio">
            <a href="../?zoom=1">photos</a>

            <a href="./index.html" class="is-active">scripts</a>
            <a href="../music.html">music</a>
            <a href="../film.html">films</a>
          </nav>
        </div>
        <div class="rail-meta">
          <a href="https://instagram.com/avery.beuth" target="_blank" rel="noopener">@avery.beuth</a>
          <a href="../privacy.html">privacy</a>
        </div>
      </aside>

      <main class="site-main">
        <div class="page-wrap">
          <header class="page-header">
            <h1 class="page-title">Scripts</h1>
            <p class="page-subtitle">screenplay pieces. click any title to read or download the pdf.</p>
          </header>

          <div id="scriptCards" class="script-grid"></div>
        </div>
      </main>
    </div>

    <script>
      const escapeHtml = (value) => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      const parseScriptFile = (text) => {
        const lines = text.split(/\r?\n/);
        let title = '';
        let subtitle = '';
        let description = '';

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!title && /^#\s+/.test(line)) {
            title = line.replace(/^#\s+/, '').trim();
            continue;
          }
          if (!subtitle && /^###\s+/.test(line) && !/^(?:###\s+)?(?:FADE IN:|INT\.|EXT\.|SUPER:|CUT TO:|CUT TO BLACK|INSERT:|END\.)/i.test(line)) {
            subtitle = line.replace(/^###\s+/, '').trim();
            continue;
          }
          if (!description && /^\*.*\*$/.test(line)) {
            description = line.replace(/^\*|\*$/g, '').trim();
            continue;
          }
          if (line === 'FADE IN:' || /^###\s+/.test(line) || /^CUT\s+TO:/.test(line) || /^CUT\s+TO\s+BLACK/i.test(line) || /^INSERT:/.test(line) || /^SUPER:/.test(line)) {
            break;
          }
        }
        return { title, subtitle, description };
      };

      const buildScriptCard = (file, script) => {
        const article = document.createElement('article');
        article.className = 'script-card';
        const slug = file.replace(/\.md$/, '');
        const viewHref = 'view.html?slug=' + encodeURIComponent(slug);
        const pdfHref = 'pdfs/' + slug + '.pdf';
        article.innerHTML = `
          <div>
            <h3><a href="${viewHref}">${escapeHtml(script.title || slug)}</a></h3>
            ${script.subtitle ? `<div class="script-card-sub">${escapeHtml(script.subtitle)}</div>` : ''}
            ${script.description ? `<p class="script-card-desc">${escapeHtml(script.description)}</p>` : ''}
          </div>
          <div class="script-card-actions">
            <a class="text-link" href="${viewHref}">read script</a>
            <a class="text-link" href="${pdfHref}" download>download pdf</a>
          </div>
        `;
        return article;
      };

      fetch('manifest.json')
        .then((res) => res.json())
        .then((files) => Promise.all(files.map(async (file) => {
          const text = await fetch(file).then((r) => r.text());
          return { file, ...parseScriptFile(text) };
        })))
        .then((scripts) => {
          const grid = document.getElementById('scriptCards');
          scripts.forEach((script) => grid.appendChild(buildScriptCard(script.file, script)));
        })
        .catch((err) => {
          document.getElementById('scriptCards').innerHTML = '<div class="empty-state">Unable to load script files.</div>';
          console.error(err);
        });
    </script>
    <script type="module" src="../assets/pages.js?v=19"></script>
</body>
</html>
