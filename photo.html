  <main id="stage">
    <div class="page-content">
      <div class="page-title">Photos</div>
      <div class="small-label">a colour-ordered archive · click any image to view it full size</div>
      <div class="photo-grid color-gallery" id="imageWall"></div>
      <div class="lightbox" id="photoLightbox" hidden>
        <button class="lightbox-close" type="button" aria-label="Close image">&times;</button>
        <img class="lightbox-image" alt="">
      </div>

      <script>
        const buildImageGrid = (targetId, paths) => {
          const grid = document.getElementById(targetId);
          paths.forEach(path => {
            const fig = document.createElement('figure');
            const link = document.createElement('a');
            const img = document.createElement('img');
            link.href = '#';
            link.addEventListener('click', event => {
              event.preventDefault();
              openLightbox(path);
            });
            img.src = path;
            img.alt = path;
            img.loading = 'lazy';
            link.appendChild(img);
            fig.appendChild(link);
            grid.appendChild(fig);
          });
        };

        const galleryImages = [...new Set([
          'photos/1.png',
          'photos/2 (1).png',

        const lightbox = document.getElementById('photoLightbox');
        const lightboxImage = lightbox.querySelector('.lightbox-image');
        const openLightbox = path => {
          lightboxImage.src = path;
          lightboxImage.alt = path;
          lightbox.hidden = false;
          document.body.classList.add('lightbox-open');
        };
        const closeLightbox = () => {
          lightbox.hidden = true;
          lightboxImage.src = '';
          document.body.classList.remove('lightbox-open');
        };
        lightbox.addEventListener('click', event => {
          if (event.target === lightbox || event.target.classList.contains('lightbox-close')) closeLightbox();
        });
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
        });

        const hueForImage = path => new Promise(resolve => {
          const image = new Image();
          image.onload = () => {
            const canvas = document.createElement('canvas');
            const size = 32;
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d', {willReadFrequently:true});
            context.drawImage(image, 0, 0, size, size);
            const pixels = context.getImageData(0, 0, size, size).data;
            const bins = Array.from({length: 12}, () => ({weight: 0, hue: 0}));
            let neutral = 0;
            for (let i = 0; i < pixels.length; i += 4) {
              const r = pixels[i] / 255;
              const g = pixels[i + 1] / 255;
              const b = pixels[i + 2] / 255;
              const max = Math.max(r, g, b);
              const min = Math.min(r, g, b);
              const delta = max - min;
              if (delta < 0.08) {
                neutral += 1;
                continue;
              }
              let hue = 0;
              if (max === r) hue = ((g - b) / delta) % 6;
              else if (max === g) hue = (b - r) / delta + 2;
              else hue = (r - g) / delta + 4;
              hue = (hue * 30 + 360) % 360;
              const bin = Math.floor(hue / 30);
              bins[bin].weight += delta * (0.5 + max);
              bins[bin].hue = hue;
            }
            const dominant = bins.filter(bin => bin.weight).sort((a, b) => b.weight - a.weight).slice(0, 3);
            if (!dominant.length || neutral > pixels.length * 0.8) {
              resolve(360);
              return;
            }
            const hue = dominant[0].hue;
            resolve((hue - 210 + 360) % 360);
          };
          image.onerror = () => resolve(360);
          image.src = path;
        });

        Promise.all(galleryImages.map(async (path, index) => ({
          path,
          index,
          hue: await hueForImage(path)
        }))).then(images => {
          images.sort((a, b) => a.hue - b.hue || a.index - b.index);
          buildImageGrid('imageWall', images.map(image => image.path));
        });
      </script>
