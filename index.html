<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avery Beuth</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <div class="sidebar-top">
      <a class="name" href="index.html">Avery Beuth</a>
      <button id="site-settings-button" type="button" aria-label="Open settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5v2.3M12 18.2v2.3M4.93 4.93l1.63 1.63M17.44 17.44l1.63 1.63M3.5 12h2.3M18.2 12h2.3M4.93 19.07l1.63-1.63M17.44 6.56l1.63-1.63M12 7.5a4.5 4.5 0 1 1 0 9a4.5 4.5 0 0 1 0-9Z"/>
        </svg>
      </button>
    </div>
    <nav class="mainnav">
      <a href="photo.html">Photos</a>
      <a href="film.html">Films</a>
      <a href="scripts/index.html">Scripts</a>
      <a href="code.html">Code</a>
    </nav>
  </aside>

  <div id="sprockets"></div>

  <main id="stage">
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
    <div class="strip" id="homeStrip"></div>
    <script>
      fetch('photos/title-strip.json').then(r=>r.json()).then(list=>{
        const strip = document.getElementById('homeStrip');
        const looped = [...list, ...list];
        looped.forEach(name => {
          const item = document.createElement('div');
          item.className = 'strip-item';
          const img = document.createElement('img');
          const src = name.startsWith('films/') || name.startsWith('http') ? name : 'photos/' + name;
          img.src = src;
          img.alt = '';
          item.appendChild(img);
          strip.appendChild(item);
        });
      }).catch(e => console.error('Could not load photos/title-strip.json for home strip', e));
    </script>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
