<style>
  /* Layout: cover and title side by side, then one row per song with space between them instead of lines. Single dark look by choice. */
  :root {
    color-scheme: dark;
    --bg: #08060f;
    --fg: #ece8ff;
    --mute: #8d88a8;
    --edge: rgba(200, 190, 255, 0.22);
    --accent: #ff7ad9;
    --display: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 0.8rem/1.9 var(--mono);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  main { max-width: 760px; margin: 0 auto; padding: 44px 2px 90px; }
  header { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 40px; }
  .cv { width: min(100%, 260px); aspect-ratio: 1; background: #05030b; }
  .cv canvas { display: block; width: 100%; height: 100%; }
  h1 {
    font: 500 clamp(1.7rem, 1.2rem + 2.6vw, 2.5rem)/1 var(--display);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0 0 24px;
    text-wrap: balance;
  }
  h2 {
    font: 400 0.82rem/1.3 var(--display);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 0;
    transition: color 0.4s;
  }
  button {
    font: inherit;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--edge);
    border-radius: 2px;
    padding: 9px 16px;
    cursor: pointer;
    min-width: 92px;
    transition: border-color 0.2s, background 0.2s;
  }
  button:hover { border-color: var(--mute); background: rgba(200, 190, 255, 0.07); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  #st { margin-left: 14px; color: var(--mute); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .trk { padding: 14px 0; }
  .hd { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
  .m { color: var(--mute); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; flex: 1; min-width: 12ch; font-variant-numeric: tabular-nums; }
  .bar { height: 2px; background: var(--edge); margin-top: 14px; opacity: 0; transition: opacity 0.5s; }
  .bar i { display: block; height: 100%; width: 0; }
  .trk.on .bar { opacity: 1; }
  .trk.on .m { color: var(--fg); }
  @media (max-width: 480px) { header { gap: 22px; } }
</style>

<main>
  <header>
    <div class="cv"><canvas id="cv" width="520" height="520" aria-label="A slowly moving glowing picture that changes with each song"></canvas></div>
    <div>
      <h1>Deepfold</h1>
      <button id="all" type="button">Play album</button><span id="st" role="status" aria-live="polite"></span>
    </div>
  </header>
  <div id="list"></div>
</main>

vec3 finish(vec3 acc, vec2 uv){

  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 160.0;

  float s = 1.0;
  orb = 1e3;
  float a = 0.55 + 0.08 * sin(T * 0.07);

      const base = (700 + sec.warp * 2600 + TRIPQ[sec.trip] * 900) * (1 + 0.55 * Math.sin(t * 0.33));
      f.frequency.setValueAtTime(base * 3, t); f.frequency.exponentialRampToValueAtTime(Math.max(180, base * 0.35), t + 0.22);
      const g = mk("createGain"); const v = accent ? 0.2 : 0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      const a1 = mk("createGain", 0.6), a2 = mk("createGain", 0.35);
      const p = ctx.createStereoPanner(); p.pan.value = rnd() * 0.8 - 0.4;
      o1.connect(a1); o2.connect(a2); a1.connect(f); a2.connect(f); f.connect(g); g.connect(p); p.connect(N.arpBus);
      o1.start(t); o2.start(t); o1.stop(t + 0.4); o2.stop(t + 0.4);
    }
    function kick(t, vol) {
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.15);
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g); g.connect(N.lowBus); o.start(t); o.stop(t + 0.45);
      N.padDuck.gain.cancelScheduledValues(t); N.padDuck.gain.setValueAtTime(0.42, t); N.padDuck.gain.linearRampToValueAtTime(1, t + 0.36);
    }
    function hat(t) {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf;
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500;
      const g = mk("createGain"); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      const p = ctx.createStereoPanner(); p.pan.value = rnd() * 0.6 - 0.3;
      s.connect(hp); hp.connect(g); g.connect(p); p.connect(N.arpBus); s.start(t, rnd() * 0.8, 0.08);
    }
    function bass(t, freq) {
      const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq;
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 4;
      f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.22);
      const g = mk("createGain"); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(f); f.connect(g); g.connect(N.lowBus); o.start(t); o.stop(t + 0.35);
    }
    function riser(dur, t) {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.2;
      bp.frequency.setValueAtTime(260, t); bp.frequency.exponentialRampToValueAtTime(7500, t + dur);
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.24, t + dur);
      g.gain.setValueAtTime(0.24, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.12);
      const pan = ctx.createStereoPanner();
      const lfo = ctx.createOscillator(); lfo.frequency.setValueAtTime(0.3, t); lfo.frequency.exponentialRampToValueAtTime(6, t + dur);
      const lg = mk("createGain", 0.9); lfo.connect(lg); lg.connect(pan.pan);
      s.connect(bp); bp.connect(g); g.connect(pan); pan.connect(N.bellBus);
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(50, t); o.frequency.exponentialRampToValueAtTime(200, t + dur);
      const og = mk("createGain"); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.14, t + dur); og.gain.linearRampToValueAtTime(0.0001, t + dur + 0.1);
      o.connect(og); og.connect(N.lowBus);
      s.start(t); lfo.start(t); o.start(t);
      s.stop(t + dur + 0.2); lfo.stop(t + dur + 0.2); o.stop(t + dur + 0.2);
    }
    function impact(t) {
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(26, t + 1.6);
      const og = mk("createGain"); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.4, t + 0.02); og.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
      o.connect(og); og.connect(N.lowBus); o.start(t); o.stop(t + 2.1);
      const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(7000, t); bp.frequency.exponentialRampToValueAtTime(220, t + 2.2);
      const g = mk("createGain"); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      const pan = ctx.createStereoPanner(); pan.pan.setValueAtTime(-0.9, t); pan.pan.linearRampToValueAtTime(0.9, t + 2.0);
      s.connect(bp); bp.connect(g); g.connect(pan); pan.connect(N.bellBus); s.start(t); s.stop(t + 2.5);
    }

    function stepEvent(t, i) {
      const P = PALETTES[trk.key], sec = secAt(t), deg = degAt(t), s = i % 16;
      if (s === 0) barPat = Math.floor(rnd() * ARP_PATS.length);
      const idx = ARP_PATS[barPat][s];
      if (trk.mode === 1) {
        if (sec.rhythm) {
          if (s === 0 || s === 8 || (s === 14 && rnd() < 0.4)) kick(t, s === 0 ? 0.85 : 0.65);
          if (s % 2 === 1) hat(t);
          if (s === 0 || s === 6 || s === 10) bass(t, mtof(degNote(P, deg) - 24));
        }
        if (sec.melody && idx >= 0 && rnd() < 0.9) pluck(t, mtof(degNote(P, deg + idx + 7 + (rnd() < 0.12 ? 7 : 0))), s % 4 === 0, sec);
      } else {
        const len = stepLen();
        if (sec.rhythm) {
          if (s === 0) kick(t, 0.8); else if (s === 10) kick(t, 0.5);
          if (s % 2 === 0) { N.padDuck.gain.cancelScheduledValues(t); N.padDuck.gain.setValueAtTime(0.22, t); N.padDuck.gain.linearRampToValueAtTime(1, t + len * 1.7); }
          if ([0, 3, 6, 10, 12].includes(s)) bass(t, mtof(degNote(P, deg) - 24 + (s === 6 || s === 12 ? 12 : 0)));
        }
        if (sec.melody && idx >= 0 && (s % 4 === 2 || s === 7 || s === 15) && rnd() < 0.85) pluck(t, mtof(degNote(P, deg + idx + 14)), s === 2, sec);
      }
    }

    function applyMode(t) {
      const d = PD[trk.mode];
      const delay = isGrid() ? 60 / (trk.bpm || 104) * 0.75 : d.delay;
      N.dL.delayTime.setValueAtTime(delay, t); N.dR.delayTime.setValueAtTime(delay, t);
      N.ppIn.gain.setValueAtTime(d.send, t);
      N.droneG.gain.setTargetAtTime(d.drone, t, 1.2);
      N.subG.gain.setTargetAtTime(d.sub, t, 0.6);
    }
    function applyTrip(idx, t) {
      const q = TRIPQ[idx];
      N.wobG.gain.setTargetAtTime(5 + q * 20, t, 0.8);
      N.vibG.gain.setTargetAtTime(2 + q * 6, t, 0.8);
      N.fbL.gain.setTargetAtTime(0.32 + q * 0.3, t, 0.8); N.fbR.gain.setTargetAtTime(0.32 + q * 0.3, t, 0.8);
      N.phWet.gain.setTargetAtTime(0.25 + q * 0.7, t, 0.8);
      N.phDepth.forEach(([g, f]) => g.gain.setTargetAtTime(f * (0.15 + q * 0.75), t, 0.8));
      N.send.gain.setTargetAtTime(0.45 + q * 0.3, t, 0.8);
    }

    function tick() {
      if (!playing) return;
      const now = ctx.currentTime, endT = t0 + trk.dur;
      if (now >= endT + 1.2) { finish(true); return; }
      // song shape: sections, the lift and the peak
      while (nextSec < SECTIONS.length) {
        const s = SECTIONS[nextSec], st = t0 + s.p * trk.dur;
        if (st > now + 1.5) break;
        const at = Math.max(st, now + 0.02);
        applyTrip(s.trip, at);
        N.padFilter.frequency.setTargetAtTime(PAD_FILTER[trk.mode] + s.warp * 2400, at, 0.9);
        if (nextSec === 4) impact(at);
        nextSec++;
      }
      const riseLen = Math.min(10, trk.dur * 0.05), riseAt = t0 + SECTIONS[4].p * trk.dur - riseLen;
      if (!riserDone && riseAt <= now + 1.5) { riserDone = true; riser(riseLen, Math.max(riseAt, now + 0.05)); }

      while (nextChord < now + 3 && nextChord < endT - 6) { playChord(Math.max(nextChord, now + 0.05)); nextChord += chordLen(); }
      if (isGrid()) {
        const STEP = stepLen();
        while (nextStep < now + 1.2 && nextStep < endT - 4) {
          const swing = stepIdx % 2 ? STEP * (trk.mode === 1 ? 0.13 : 0.05) : 0;
          stepEvent(Math.max(nextStep + swing, now + 0.01), stepIdx);
          nextStep += STEP; stepIdx++;
        }
      } else {
        while (nextBell < now + 1.5 && nextBell < endT - 4) {
          const at = Math.max(nextBell, now + 0.02), sec = secAt(at);
          if (sec.melody) { if (trk.mode === 3) twinkle(at); else bell(at); }
          nextBell += trk.mode === 3 ? (0.3 + rnd() * 1.1) * (1 - 0.6 * sec.warp)
                                     : (1.6 + rnd() * 2.6) * (1 - 0.7 * sec.warp) * (trk.mode === 2 ? 2.1 : 1);
        }
        if ((trk.mode === 2 || trk.mode === 3) && nextGlide < now + 1.5 && nextGlide < endT - 12) {
          const at = Math.max(nextGlide, now + 0.05);
          if (secAt(at).melody) glide(at);
          nextGlide += (trk.mode === 3 ? 10 : 7) + rnd() * 6;
        }
      }
    }

    function teardown(fast) {
      clearInterval(timer); timer = null; playing = false;
      if (!N) return;
      const old = { N, persist }, now = ctx.currentTime;
      old.N.master.gain.cancelScheduledValues(now);
      old.N.master.gain.setValueAtTime(old.N.master.gain.value, now);
      old.N.master.gain.linearRampToValueAtTime(0, now + (fast ? 0.35 : 0.05));
      setTimeout(() => {
        old.persist.forEach(o => { try { o.stop(); } catch (e) {} });
        try { old.N.comp.disconnect(); } catch (e) {}
      }, fast ? 800 : 200);
      N = null; persist = [];
    }
    function finish(natural) {
      const done = onEnd, k = nowIdx;
      teardown(false); nowIdx = -1;
      if (done) done(k, natural);
    }

    return {
      get playing() { return playing; },
      get index() { return nowIdx; },
      async play(k, cb) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        if (!ctx) {
          ctx = new AC();
          irBuf = makeIR(7, 2.3);
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
          const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
        }
        await ctx.resume();
        if (playing) teardown(true);
        trk = TRACKS[k]; nowIdx = k; onEnd = cb;
        rnd = rngFrom(trk.seed);
        build();
        t0 = ctx.currentTime + 0.25;
        chordStep = 0; timeline = []; stepIdx = 0; barPat = 0; nextSec = 0; riserDone = false;
        nextChord = t0; nextStep = t0;
        nextBell = t0 + SECTIONS[1].p * trk.dur; nextGlide = t0 + SECTIONS[1].p * trk.dur + 6;
        bellDeg = trk.mode === 2 ? 12 : 15;
        applyMode(t0); applyTrip(0, t0);
        const fadeIn = Math.min(6, trk.dur * 0.04), fadeOut = Math.min(12, trk.dur * 0.07);
        N.master.gain.setValueAtTime(0, t0); N.master.gain.linearRampToValueAtTime(0.85, t0 + fadeIn);
        N.master.gain.setValueAtTime(0.85, t0 + trk.dur - fadeOut); N.master.gain.linearRampToValueAtTime(0, t0 + trk.dur);
        playing = true; tick(); timer = setInterval(tick, 250);
        return true;
      },
      stop() { if (ctx && (playing || N)) { const k = nowIdx; teardown(true); nowIdx = -1; if (onEnd) onEnd(k, false); } },
      elapsed() { return playing ? Math.max(0, Math.min(trk.dur, ctx.currentTime - t0)) : 0; },
      section() { return playing ? secAt(ctx.currentTime) : SECTIONS[1]; },
      level() {
        if (!analyser || !playing) return 0;
        const d = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(d);
        let s = 0; for (let i = 0; i < d.length; i++) { const v = (d[i] - 128) / 128; s += v * v; }
        return Math.min(1, Math.sqrt(s / d.length) * 7);
      }
    };
  })();

  /* ============ the cover ============ */
  const cv = document.getElementById("cv");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NAMES = ["R", "T", "Z", "M", "W", "A", "Q", "F", "H", "pa", "pb", "pc", "pd"];
  let gl = null; const progs = [];
  const cover = { mode: 0, key: 0, F: 0, Q: 0.3, A: 0, W: 0, T: 8, Z: 0 };
  const pcur = PALETTES[0].p.map(v => v.slice());
  function compile(m) {
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, SHADERS[m]);
    if (!vs || !fs) return null;
    const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    const U = {}; NAMES.forEach(n => { U[n] = gl.getUniformLocation(prog, n); });
    return { prog, U, loc: gl.getAttribLocation(prog, "a") };
  }
  function sizeCover() {
    const s = Math.max(120, Math.round(cv.clientWidth * Math.min(window.devicePixelRatio || 1, 2) * 0.8));
    if (cv.width !== s) { cv.width = s; cv.height = s; }
  }
  function startCover() {
    gl = cv.getContext("webgl", { antialias: false, alpha: false });
    if (!gl) return;
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    sizeCover(); window.addEventListener("resize", sizeCover);
    let last = performance.now();
    (function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (document.hidden) return;
      if (progs[cover.mode] === undefined) progs[cover.mode] = compile(cover.mode);
      const p = progs[cover.mode]; if (!p) return;
      const sec = Player.section(), on = Player.playing;
      const qWant = on ? TRIPQ[sec.trip] * 0.9 : 0.3, wWant = on ? sec.warp : 0;
      cover.Q += (qWant - cover.Q) * (1 - Math.pow(0.15, dt));
      cover.W += (wWant - cover.W) * (1 - Math.pow(0.1, dt));
      const lv = Player.level(); cover.A += (lv - cover.A) * (lv > cover.A ? 0.5 : 1 - Math.pow(0.15, dt));
      cover.F = Math.min(1, cover.F + dt / 1.4);
      const k = reduce ? 0.3 : 1;
      cover.T += dt * k; cover.Z += dt * k * (0.8 + cover.W * 2);
      for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) pcur[r][c] += (PALETTES[cover.key].p[r][c] - pcur[r][c]) * (1 - Math.pow(0.12, dt));
      gl.useProgram(p.prog); gl.enableVertexAttribArray(p.loc); gl.vertexAttribPointer(p.loc, 2, gl.FLOAT, false, 0, 0);
      gl.viewport(0, 0, cv.width, cv.height);
      const U = p.U;
      gl.uniform2f(U.R, cv.width, cv.height); gl.uniform1f(U.T, cover.T); gl.uniform1f(U.Z, cover.Z);
      gl.uniform2f(U.M, 0.5 * Math.sin(cover.T * 0.13), 0.3 * Math.sin(cover.T * 0.09 + 1)); gl.uniform1f(U.W, cover.W); gl.uniform1f(U.A, cover.A);
      gl.uniform1f(U.Q, cover.Q); gl.uniform1f(U.F, cover.F); gl.uniform1f(U.H, 0);
      gl.uniform3fv(U.pa, pcur[0]); gl.uniform3fv(U.pb, pcur[1]); gl.uniform3fv(U.pc, pcur[2]); gl.uniform3fv(U.pd, pcur[3]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    })(last);
  }
  function setCover(mode, key) { if (cover.mode !== mode || cover.key !== key) { cover.mode = mode; cover.key = key; cover.F = 0; } }

  /* ============ the page ============ */
  const $ = s => document.querySelector(s);
  const fmt = s => (s / 60 | 0) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const rows = [];
  const list = $("#list");
  TRACKS.forEach((t, k) => {
    const P = PALETTES[t.key];
    const e = document.createElement("section");
    e.className = "trk";
    e.innerHTML = '<div class="hd"><h2></h2><span class="m"></span><button type="button" data-p>Play</button></div><div class="bar"><i></i></div>';
    e.querySelector("h2").textContent = (k + 1) + ". " + t.name;
    e.querySelector(".m").textContent = fmt(t.dur);
    e.querySelector(".bar i").style.background = P.css;
    e.querySelector("[data-p]").setAttribute("aria-label", "Play " + t.name);
    e.querySelector("[data-p]").onclick = () => { if (Player.index === k) Player.stop(); else playTrack(k); };
    list.appendChild(e);
    rows.push({ e, h2: e.querySelector("h2"), m: e.querySelector(".m"), btn: e.querySelector("[data-p]"), bar: e.querySelector(".bar i") });
  });

  const allBtn = $("#all"), st = $("#st");
  let wantAlbum = false;
  function paint() {
    const cur = Player.index;
    rows.forEach((r, k) => {
      const on = k === cur;
      r.e.classList.toggle("on", on);
      r.btn.textContent = on ? "Stop" : "Play";
      r.btn.setAttribute("aria-label", (on ? "Stop " : "Play ") + TRACKS[k].name);
      r.h2.style.color = on ? PALETTES[TRACKS[k].key].c : "";
      if (!on) { r.m.textContent = fmt(TRACKS[k].dur); r.bar.style.width = "0"; }
    });
    allBtn.textContent = cur >= 0 ? "Stop" : "Play album";
    st.textContent = cur >= 0 ? "Now playing " + TRACKS[cur].name : "";
  }
  function setMedia(k) {
    if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[k].name, artist: "Deepfold", album: "Deepfold Instrumentals" });
      navigator.mediaSession.setActionHandler("play", () => { if (Player.index < 0) playTrack(k); });
      navigator.mediaSession.setActionHandler("pause", () => Player.stop());
      navigator.mediaSession.setActionHandler("nexttrack", () => playTrack((k + 1) % TRACKS.length));
      navigator.mediaSession.setActionHandler("previoustrack", () => playTrack((k + TRACKS.length - 1) % TRACKS.length));
    } catch (e) {}
  }
  let gapTimer = null;
  async function playTrack(k) {
    clearTimeout(gapTimer); gapTimer = null;
    setCover(TRACKS[k].mode, TRACKS[k].key);
    const ok = await Player.play(k, (done, natural) => {
      paint();
      if (natural) { gapTimer = setTimeout(() => { gapTimer = null; playTrack((done + 1) % TRACKS.length); }, 2500); }
    });
    if (!ok) { st.textContent = "Sound is not available in this browser."; return; }
    setMedia(k); paint();
  }
  allBtn.onclick = () => { if (Player.index >= 0 || gapTimer) { clearTimeout(gapTimer); gapTimer = null; Player.stop(); paint(); } else playTrack(0); };

  (function tickUi() {
    requestAnimationFrame(tickUi);
    const k = Player.index;
    if (k >= 0 && Player.playing) {
      const el = Player.elapsed(), d = TRACKS[k].dur;
      rows[k].bar.style.width = (el / d * 100).toFixed(2) + "%";
      rows[k].m.textContent = fmt(el) + " / " + fmt(d);
    }
  })();

  setCover(0, 0);
  startCover();
  paint();
})();
</script>
