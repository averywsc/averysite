<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="description" content="Photographs, films, screenplays, music, and software by Avery Beuth." />
    <meta property="og:title" content="averybeuth.xyz" />
    <meta property="og:description" content="Photographs, films, screenplays, music, and software by Avery Beuth." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://averybeuth.xyz/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://averybeuth.xyz/og-preview.jpg" />
    <link rel="icon" type="image/png" href="./favicon.png?v=24" />
    <link rel="apple-touch-icon" href="./favicon.png?v=24" />
    <title>averybeuth.xyz</title>
    <link rel="stylesheet" href="./assets/gallery.css?v=26" />
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="loader__line"><i></i></div>
    </div>

    <main id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
    </main>
    <div id="scroll" aria-hidden="true"></div>

    <a class="mark" id="mark" href="./">averybeuth.xyz</a>
    <nav class="side-nav" aria-label="Portfolio">
      <a href="./code.html">code</a>
      <a href="./scripts/index.html">scripts</a>
      <a href="./music.html">music</a>
      <a href="./film.html">films</a>
      <button type="button" id="sidePhotos">photos</button>
    </nav>

    <nav class="nav-right" aria-label="Controls">
      <button class="zoom-btn" id="zoomBtn" type="button">zoom</button>
      <button class="all-photos" id="allPhotos" type="button">all photos</button>
      <button class="sound" id="sound" type="button" aria-pressed="false">
        <span class="sound__label">sound</span>
      </button>
    </nav>

    <div class="progress" aria-hidden="true"><i></i></div>
    <div class="photo-counter" id="photoCounter" aria-hidden="true"></div>
    <div class="hint" id="hint" aria-hidden="true"><span>hold space or scroll</span><i></i></div>

    <section class="finale" id="finale">
      <a class="finale__name" id="finaleName" href="./">
        <img class="finale__wordmark" src="./wordmark.png" alt="avery beuth" />
      </a>
      <div class="finale__links">
        <a class="finale__contact" id="finaleContact" href="https://instagram.com/avery.beuth" target="_blank" rel="noopener">@avery.beuth</a>
      </div>
      <nav class="finale__nav" aria-label="Portfolio sections">
        <a href="./code.html">code</a>
        <a href="./scripts/index.html">scripts</a>
        <a href="./music.html">music</a>
        <a href="./film.html">films</a>
        <button type="button" id="finalePhotos">photos</button>
      </nav>
      <div class="finale__prompt" id="finalePrompt">click anywhere to browse photos</div>
    </section>

    <div class="calm" id="calm" hidden></div>
    <ul class="sr-only" id="srList" aria-label="Photographs"></ul>
    <div class="cursor" id="cursor" aria-hidden="true"><i class="cursor__ring"></i><i class="cursor__dot"></i></div>

    <script type="module" src="./assets/gallery.js?v=26"></script>
  </body>
</html>
