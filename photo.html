        <input id="gallerySize" type="range" min="48" max="352" value="200" aria-label="Photo size; move left for more photos and right for larger photos">
        <span class="gallery-size-end" aria-hidden="true">+</span>
      </div>
      <div class="photo-grid color-gallery" id="imageWall"></div>
      <div class="lightbox" id="photoLightbox" hidden>
        <button class="lightbox-close" type="button" aria-label="Close image">&times;</button>

      <script>
        const photoObserver = 'IntersectionObserver' in window
          ? new IntersectionObserver((entries, observer) => {
              entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const image = entry.target;
                image.src = image.dataset.src;
                observer.unobserve(image);
              });
            }, {root: document.querySelector('.page-content'), rootMargin: '400px 0px'})
          : null;

        const photoSizeControl = document.getElementById('gallerySize');

        const updateGalleryLayout = () => {
          const grid = document.getElementById('imageWall');
          const targetPhotoWidth = Number(photoSizeControl.value);
          const columns = Math.max(1, Math.min(12, Math.round(grid.clientWidth / targetPhotoWidth)));
          grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;

          const figures = grid.querySelectorAll('figure');
          figures.forEach(figure => {
            figure.style.gridColumn = '';
            figure.style.gridRowEnd = '';
          });

          figures.forEach(figure => {
            const image = figure.querySelector('img');
            if (image.complete) layoutPhoto(figure, image);
          });
        };

        const layoutPhoto = (figure, image) => {
          if (!image.naturalWidth || !image.naturalHeight) return;
          const grid = figure.parentElement;
          const columns = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
          const styles = getComputedStyle(grid);
          const gap = parseFloat(styles.columnGap);
          const rowHeight = parseFloat(styles.gridAutoRows);
          const rowGap = parseFloat(styles.rowGap);
          const columnWidth = (grid.clientWidth - gap * (columns - 1)) / columns;
          const maxSpan = Math.max(1, Math.ceil(columns * 2 / 3));
          const minSpan = 1;
          const targetPhotoWidth = Number(photoSizeControl.value);
          const idealSpan = Math.round((targetPhotoWidth * image.naturalWidth / image.naturalHeight + gap) / (columnWidth + gap));
          const columnSpan = Math.max(minSpan, Math.min(maxSpan, idealSpan));
          const imageWidth = columnWidth * columnSpan + gap * (columnSpan - 1);
          const imageHeight = imageWidth * image.naturalHeight / image.naturalWidth;

          figure.style.gridColumn = `span ${columnSpan}`;
          figure.style.gridRowEnd = `span ${Math.ceil((imageHeight + 2 + rowGap) / (rowHeight + rowGap))}`;
        };

        const buildImageGrid = (targetId, paths) => {
          const grid = document.getElementById(targetId);
          paths.forEach(path => {
            const fig = document.createElement('figure');
            const link = document.createElement('a');
            const img = document.createElement('img');
            link.href = '#';
            link.addEventListener('click', event => {
              event.preventDefault();
              openLightbox(path);
            });
            img.dataset.src = path;
            img.alt = path;
            img.loading = 'lazy';
            img.addEventListener('load', () => layoutPhoto(fig, img));
            if (photoObserver) photoObserver.observe(img);
            else img.src = path;
            if (focalPositions[path]) img.style.objectPosition = focalPositions[path];
            link.appendChild(img);
            fig.appendChild(link);
            grid.appendChild(fig);
          });
        };

        window.addEventListener('resize', updateGalleryLayout);
        photoSizeControl.addEventListener('input', updateGalleryLayout);

          lightboxImage.src = path;
          lightboxImage.alt = path;
          lightbox.hidden = false;
          document.body.classList.add('lightbox-open');
        };
        const closeLightbox = () => {
          lightbox.hidden = true;
          lightboxImage.src = '';
          document.body.classList.remove('lightbox-open');
        };
        lightbox.addEventListener('click', event => {
          if (event.target === lightbox || event.target.classList.contains('lightbox-close')) closeLightbox();

        document.addEventListener('keydown', event => {
