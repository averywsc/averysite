<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avery Beuth | Home</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <div class="sidebar-top">
      <a class="name" href="index.html">Avery Beuth</a>
      <button id="site-settings-button" type="button" aria-label="Open settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5v2.3M12 18.2v2.3M4.93 4.93l1.63 1.63M17.44 17.44l1.63 1.63M3.5 12h2.3M18.2 12h2.3M4.93 19.07l1.63-1.63M17.44 6.56l1.63-1.63M12 7.5a4.5 4.5 0 1 1 0 9a4.5 4.5 0 0 1 0-9Z"/>
        </svg>
      </button>
    </div>
    <nav class="mainnav">
      <a href="photo.html">Photos</a>
      <a href="film.html">Films</a>
      <a href="scripts/index.html">Scripts</a>
      <a href="code.html">Code</a>
    </nav>
  </aside>

  <div id="sprockets"></div>

  <main id="stage">
  <div class="strip" id="homeStrip"></div>
    <script>
      fetch('photo.html').then(response => response.text()).then(photoPage => {
        const galleryBlock = photoPage.match(/const galleryImages = \[\.\.\.new Set\(\[(.*?)\]\)\];/s);
        if (!galleryBlock) throw new Error('Could not find the Photos page gallery list');
        const galleryImages = [...galleryBlock[1].matchAll(/'([^']+)'/g)].map(match => match[1]);
        const list = [...new Set(galleryImages)].map(path => {
          const filename = path.slice(path.lastIndexOf('/') + 1);
          const baseName = filename.replace(/\.[^.]+$/, '');
          return `thumbs/${baseName}.jpg`;
        });
        const strip = document.getElementById('homeStrip');
        const originalStripLength = 24;
        strip.style.animationDuration = `${52 * list.length / originalStripLength}s`;
        const shuffled = [...list];
        let previousOrder = '';
        try {
          previousOrder = localStorage.getItem('averysite-title-strip-order') || '';
        } catch (error) {}

        for (let i = shuffled.length - 1; i > 0; i--) {
          const randomIndex = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[i]];
        }

        if (shuffled.length > 1 && shuffled.join('|') === previousOrder) {
          [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
        }

        try {
          localStorage.setItem('averysite-title-strip-order', shuffled.join('|'));
        } catch (error) {}

        const looped = [...shuffled, ...shuffled];
        looped.forEach(name => {
          const item = document.createElement('div');
          item.className = 'strip-item';
          const img = document.createElement('img');
          const src = name.startsWith('films/') || name.startsWith('http') ? name : 'photos/' + name;
          img.src = src;
          img.alt = '';
          item.appendChild(img);
          strip.appendChild(item);
        });
        requestAnimationFrame(() => {
          strip.classList.add('is-ready');
          if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            const animation = strip.getAnimations()[0];
            if (animation) {
              strip.addEventListener('mouseenter', () => animation.updatePlaybackRate(52 / 180));
              strip.addEventListener('mouseleave', () => animation.updatePlaybackRate(1));
            }
          }
        });
      }).catch(e => console.error('Could not load the Photos page gallery for home strip', e));
    </script>
  </main>
</div>

<div class="fade-top" aria-hidden="true"></div>
<div class="fade-bottom" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
