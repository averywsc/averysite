  <body>

      <main class="site-main">
        <div class="page-wrap page-wrap--narrow">
          <div class="script-toolbar" id="scriptToolbar">
            <a href="./index.html" class="text-link">all scripts</a>
            <a id="topPdfLink" class="text-link" href="./pdfs/leos-date.pdf" download>download pdf</a>
          </div>
          <div id="scriptDetail"></div>
          <nav class="script-pager" id="scriptPager" aria-label="Script navigation" hidden></nav>
        </div>
      </main>
    </div>

    <script>
      const isCharacterLine = (line) => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('### ') || trimmed.startsWith('FADE') || trimmed.startsWith('CUT ') || trimmed.startsWith('INSERT:') || trimmed.startsWith('SUPER:') || trimmed.startsWith('**')) {
          return false;
        }
        return /^[A-Z0-9'().,/\-\s]+$/.test(trimmed) && trimmed.length <= 80 && !/^(INT|EXT|A\s|B\s|C\s|D\s|E\s|F\s|G\s|H\s|I\s|J\s|K\s|L\s|M\s|N\s|O\s|P\s|Q\s|R\s|S\s|T\s|U\s|V\s|W\s|X\s|Y\s|Z\s)/.test(trimmed);
      };

      const escapeHtml = (value) => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      const formatInline = (value) => escapeHtml(value).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      const renderScriptBody = (mdText) => {
        const lines = mdText.split(/\r?\n/);
        const body = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i].trim();
          if (!line) { i++; continue; }

          if (line === 'FADE IN:' || line === 'FADE OUT.' || line === 'CUT TO:' || line === 'CUT TO BLACK' || line === 'END.' || /^\*\*END\./.test(line)) {
            body.push('<p class="script-transition">' + formatInline(line.replace(/^\*\*/, '')) + '</p>');
            i++;
            continue;
          }

          if (line.startsWith('### ')) {
            body.push('<h3 class="script-scene">' + formatInline(line.replace(/^###\s+/, '')) + '</h3>');
            i++;
            continue;
          }

          if (line.startsWith('SUPER:')) {
            body.push('<p class="script-super">' + formatInline(line.replace(/^SUPER:\s*/, '')) + '</p>');
            i++;
            continue;
          }

          if (line.startsWith('INSERT:')) {
            body.push('<p class="script-insert">' + formatInline(line.replace(/^INSERT:\s*/, '')) + '</p>');
            i++;
            continue;
          }

          if (line.startsWith('Written by')) {
            body.push('<p class="script-credit">' + formatInline(line) + '</p>');
            i++;
            continue;
          }

          if (line.startsWith('*') && line.endsWith('*')) {
            body.push('<p class="script-description">' + formatInline(line.slice(1, -1)) + '</p>');
            i++;
            continue;
          }

          if (isCharacterLine(line)) {
            const speaker = formatInline(line);
            const dialogue = [];
            i++;
            while (i < lines.length) {
              const next = lines[i].trim();
              if (!next) { i++; continue; }
              if (next.startsWith('### ') || next.startsWith('FADE') || next.startsWith('CUT ') || next.startsWith('INSERT:') || next.startsWith('SUPER:') || isCharacterLine(next)) {
                break;
              }
              dialogue.push(formatInline(next));
              i++;
            }
            body.push('<div class="script-character">' + speaker + '</div>');
            if (dialogue.length) {
              body.push('<div class="script-dialogue"><p>' + dialogue.join('</p><p>') + '</p></div>');
            }
            continue;
          }

          body.push('<p class="script-action">' + formatInline(line) + '</p>');
          i++;
        }

        return body.join('');
      };

      const parseScriptFile = (text) => {
        const lines = text.split(/\r?\n/);
        let title = '';
        let subtitle = '';
        let description = '';
        let bodyStart = lines.length;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!title && /^#\s+/.test(line)) {
            title = line.replace(/^#\s+/, '').trim();
            continue;
          }
          if (!subtitle && /^###\s+/.test(line) && !/^(?:###\s+)?(?:FADE IN:|INT\.|EXT\.|SUPER:|CUT TO:|CUT TO BLACK|INSERT:|END\.)/i.test(line)) {
            subtitle = line.replace(/^###\s+/, '').trim();
            continue;
          }
          if (!description && /^\*.*\*$/.test(line)) {
            description = line.replace(/^\*|\*$/g, '').trim();
            continue;
          }
          if (line === 'FADE IN:' || /^###\s+/.test(line) || /^CUT\s+TO:/.test(line) || /^CUT\s+TO\s+BLACK/i.test(line) || /^INSERT:/.test(line) || /^SUPER:/.test(line)) {
            bodyStart = i;
            break;
          }
        }

        return {
          title,
          subtitle,
          description,
          body: lines.slice(bodyStart).join('\n')
        };
      };

      const slug = (new URLSearchParams(window.location.search).get('slug') || 'leos-date').replace(/[^a-z0-9-_]/gi, '');
      const pdfHref = './pdfs/' + slug + '.pdf';
      document.getElementById('topPdfLink').href = pdfHref;
      if (slug === 'leos-date') {
        const filmLink = document.createElement('a');
        filmLink.className = 'text-link';
        filmLink.href = '../film.html';
        filmLink.textContent = 'watch film';
        document.getElementById('scriptToolbar')?.appendChild(filmLink);
      }

      fetch('./' + slug + '.md')
        .then((res) => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then((text) => {
          const script = parseScriptFile(text);
          document.title = `averybeuth.xyz / ${script.title || slug}`;
          const hasText = script.body.trim().length > 0;
          const wrap = document.querySelector('.page-wrap');
          if (!hasText && wrap) {
            wrap.classList.remove('page-wrap--narrow');
            wrap.classList.add('page-wrap--pdf');
          }
          const bodyHtml = hasText
            ? `<div class="screenplay-body">${renderScriptBody(script.body)}</div>`
            : `<iframe class="script-pdf-frame" src="${pdfHref}#toolbar=1&navpanes=0&view=FitW" title="${escapeHtml(script.title || slug)} PDF"></iframe>`;
          document.getElementById('scriptDetail').innerHTML = `
            <header class="script-doc-header">
              <h1>${escapeHtml(script.title || slug)}</h1>
              ${script.subtitle ? `<div class="script-doc-sub">${escapeHtml(script.subtitle)}</div>` : ''}
              ${script.description ? `<p class="script-doc-lead">${escapeHtml(script.description)}</p>` : ''}
            </header>
            ${bodyHtml}
          `;
        })
        .catch((err) => {
          document.getElementById('scriptDetail').innerHTML = '<div class="empty-state">Unable to load script.</div>';
          console.error(err);
        });

      fetch('./manifest.json')
        .then((res) => res.ok ? res.json() : [])
        .then((files) => {
          const list = Array.isArray(files) ? files.map((f) => f.replace(/\.md$/i, '')) : [];
          const idx = list.indexOf(slug);
          const pager = document.getElementById('scriptPager');
          if (!pager || idx < 0) return;
          const prevSlug = idx > 0 ? list[idx - 1] : null;
          const nextSlug = idx < list.length - 1 ? list[idx + 1] : null;
          const label = (s) => s.replace(/-/g, ' ');
          pager.innerHTML = `
            ${prevSlug ? `<a class="text-link" href="./view.html?slug=${encodeURIComponent(prevSlug)}">prev: ${escapeHtml(label(prevSlug))}</a>` : '<span></span>'}
            <a class="text-link" href="./index.html">all scripts</a>
            ${nextSlug ? `<a class="text-link" href="./view.html?slug=${encodeURIComponent(nextSlug)}">next: ${escapeHtml(label(nextSlug))}</a>` : '<span></span>'}
          `;
          pager.hidden = false;
        })
        .catch(() => {});
    </script>
    <script type="module" src="../assets/pages.js?v=56"></script>
</body>
